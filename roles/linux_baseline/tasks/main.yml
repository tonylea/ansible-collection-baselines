---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - linux_baseline
    - packages

- name: Perform system upgrade
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: linux_baseline_perform_system_update | bool
  tags:
    - linux_baseline
    - packages
    - system-update

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ linux_baseline_common_packages }}"
    state: present
  tags:
    - linux_baseline
    - packages

- name: Set timezone
  community.general.timezone:
    name: "{{ linux_baseline_timezone }}"
  notify: Restart cron
  tags:
    - linux_baseline
    - timezone

- name: Configure locale
  community.general.locale_gen:
    name: "{{ linux_baseline_locale }}"
    state: present
  tags:
    - linux_baseline
    - locale

- name: Set locale as default
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ linux_baseline_locale }}"
    create: true
    mode: "0644"
  tags:
    - linux_baseline
    - locale

- name: Install NTP package
  ansible.builtin.apt:
    name: "{{ linux_baseline_ntp_package }}"
    state: present
  when: linux_baseline_ntp_enabled | bool
  tags:
    - linux_baseline
    - ntp

- name: Configure chrony NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  when: linux_baseline_ntp_enabled | bool
  notify: Restart chrony
  tags:
    - linux_baseline
    - ntp

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: "{{ linux_baseline_ntp_service }}"
    state: started
    enabled: true
  when: linux_baseline_ntp_enabled | bool
  tags:
    - linux_baseline
    - ntp
